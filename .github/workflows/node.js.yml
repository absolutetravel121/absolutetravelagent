name: Deploy Project to VPS

on:
  workflow_dispatch: # Manual trigger (optional)
    inputs:
      project:
        description: 'Project to deploy (backend/frontend/agent/admin)'
        required: true
        default: 'agent'
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Deployment on VPS
      run: |
        PROJECT="${{ github.event.inputs.project || 'agent' }}"
        PAYLOAD="{\"ref\":\"refs/heads/development\",\"project\":\"$PROJECT\"}"
        SIGNATURE="sha256=$(echo -n $PAYLOAD | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | sed 's/^.* //')"

        echo "🚀 Deploying $PROJECT..."
        curl -X POST \
          --fail \
          -H "Content-Type: application/json" \
          -H "X-Hub-Signature-256: $SIGNATURE" \
          --data "$PAYLOAD" \
          http://69.62.75.137:9000/webhook
